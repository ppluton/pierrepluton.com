8 C 760 938, 820 833, 980 833" fill="none" stroke="#adc4ce" stroke-width="1" opacity=".5"/><path d="M 600 938 C 760 938, 820 927, 980 927" fill="none" stroke="#adc4ce" stroke-width="1" opacity=".5"/><rect x="45" y="150" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="177" font-size="18">P1 · Découvrez le métier d’AI Engineer</text><rect x="45" y="209" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="236" font-size="18">P2 · Requêtez des services IA</text><rect x="45" y="268" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="295" font-size="18">P3 · Anticipez les besoins en consommations de bâtim…</text><rect x="45" y="327" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="354" font-size="18">P4 · Classifiez automatiquement des informations</text><rect x="45" y="386" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="413" font-size="18">P5 · Déployez un modèle de Machine Learning</text><rect x="45" y="445" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="472" font-size="18">P6 · Initiez-vous au MLOps — partie 1</text><rect x="45" y="504" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="531" font-size="18">P7 · Concevez et déployez un système RAG</text><rect x="45" y="563" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="590" font-size="18">P8 · Confirmez vos compétences en MLOps — partie 2</text><rect x="45" y="622" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="649" font-size="18">P9 · Réalisez le cadrage d’un projet IA</text><rect x="45" y="681" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="708" font-size="18">P10 · Labellisez et appliquez des approches semi-supe…</text><rect x="45" y="740" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="767" font-size="18">P11 · Entraînez votre agent RL — Eagle-1</text><rect x="45" y="799" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="826" font-size="18">P12 · Extrayez des données multimodales de sites web</text><rect x="45" y="858" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="885" font-size="18">P13 · Mettez en place un Agent IA — IA Chess</text><rect x="45" y="917" width="555" height="43" rx="6" fill="#fff" stroke="#d9dedf"/><text x="60" y="944" font-size="18">P14 · Fine-tunez votre propre LLM — POC médical</text><rect x="980" y="150" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="182" font-size="22">Cadrage &amp; produit</text><rect x="980" y="244" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="276" font-size="22">Données &amp; pipelines</text><rect x="980" y="338" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="370" font-size="22">ML supervisé</text><rect x="980" y="432" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="464" font-size="22">Vision &amp; semi-supervisé</text><rect x="980" y="526" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="558" font-size="22">Apprentissage par renforcement</text><rect x="980" y="620" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="652" font-size="22">RAG, agents &amp; LLM</text><rect x="980" y="714" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="746" font-size="22">API &amp; applications</text><rect x="980" y="808" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="840" font-size="22">MLOps &amp; exploitation</text><rect x="980" y="902" width="420" height="51" rx="7" fill="#e8f1f3" stroke="#d9dedf"/><text x="998" y="934" font-size="22">Communication &amp; recul</text><text x="45" y="1025" font-size="18" fill="#53656e">P6 et P8 partagent un dépôt. P1/P3/P9 : preuves OC, sans dépôt associé avec certitude. P14 : validé (confirmation de Pierre, 11 octobre 2026).</text></g></svg>